[tool.poetry]
name = "crag-v3"
version = "3.0.0"
description = "Neuro-Symbolic Knowledge Graph Retrieval (C-RAG V3)"
authors = ["Your Name <you@example.com>"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
torch = "^2.0.0"
torch-geometric = "^2.3.0"
sentence-transformers = "^2.2.0"
faiss-cpu = "^1.7.4"
numpy = "^1.24.0"
scipy = "^1.11.0"
scikit-learn = "^1.3.0"
pyyaml = "^6.0"
requests = "^2.31.0"
tqdm = "^4.66.0"
fastapi = "^0.109.0"
uvicorn = {extras = ["standard"], version = "^0.27.0"}
pydantic = "^2.5.0"
# Optional dependencies
metis = {version = "^0.2", optional = true}
leidenalg = {version = "^0.10.0", optional = true}
openai = {version = "^1.0.0", optional = true}
anthropic = {version = "^0.8.0", optional = true}
psutil = {version = "^5.9.0", optional = true}

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
pytest-benchmark = "^4.0.0"
pytest-asyncio = "^0.21.0"
black = "^23.10.0"
isort = "^5.12.0"
mypy = "^1.6.0"
hypothesis = "^6.92.0"
locust = "^2.18.0"

[tool.poetry.extras]
partitioning = ["metis", "leidenalg"]
llm = ["openai", "anthropic"]
monitoring = ["psutil"]
all = ["metis", "leidenalg", "openai", "anthropic", "psutil"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
    "gpu: marks tests as requiring GPU"
]

[tool.black]
line-length = 100
target-version = ['py310']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
